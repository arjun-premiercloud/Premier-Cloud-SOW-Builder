assumptions:
  gemini_enterprise_implementation:
    - "Additional data connectors will impact the delivery schedule and cost."
    - "Customer is using compatible versions of the identified connectors and source systems."
    - >-
      A single identity provider ({{identity_provider}}) will be supported for
      this engagement.
    - >-
      If using the private access option for any connector, Customer will set up
      Private Service Connect between their Google Cloud network environment and
      the network of the third-party data source, prior to the start of the
      engagement.
    - 'Customer will provide valid, accessible, and "clean" data in the specified source systems.'
    - >-
      Customer will grant Partner's team the necessary administrative rights and
      permissions within their environment to configure the required services for
      the Gemini Enterprise implementation.
    - >-
      Customer shall assign qualified subject matter experts and technical points
      of contact to support Partner during this engagement.
    - "All Services will be performed remotely by Partner from North America."
  agent_pilot:
    - "Customer will provide access to the chosen pilot environment within timelines agreed in Phase 1."
    - "Customer will be responsible for establishing the private connectivity between their local systems and Google Cloud."
    - >-
      Customer will supply representative call flows and scripts, knowledge
      articles, sample interactions, and relevant data records during Phase 1 to
      seed agent design.
    - >-
      Customer's technical team and named technical contacts will be available for
      joint discovery, review, and UAT activities at the agreed cadence.
    - >-
      Open API endpoints to the chosen pilot configuration of Customer's systems
      of record are documented and accessible to Premier Cloud during the build
      phases.
    - >-
      Pilot scenarios and the associated use-case and decision-tree scope are
      agreed in Phase 1; significant scope additions during the pilot are
      addressed through a written Change Request.
    - "The Google Cloud services referenced in this SOW are available in the region(s) Customer elects for the pilot environment."
    - >-
      Customer's organizational alignment supports the pilot timeline, including
      the availability of executive and technical stakeholders for milestone
      reviews and the final pilot review meeting.
  workspace_migration:
    - >-
      Administrative credentials in both tenants are provisioned per the
      migration tool's prerequisites (Global Admin in the source tenant; Super
      Admin or equivalent in the Google Workspace destination).
    - >-
      Source-platform API throttling is absorbed by the migration worker pool
      sizing; migration windows are scheduled around peak business hours where
      throttling is heaviest.
    - >-
      Network bandwidth from the source platform to the migration worker pool is
      sufficient for the total data volume; worker count and concurrency may be
      tuned during pilot.
    - "Premier Cloud and Customer maintain a weekly status cadence throughout the engagement."

